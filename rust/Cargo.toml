[workspace]
resolver = "3"
members = ["il_types", "font_core", "p2_stages", "p2_bridge", "ir_core", "writer_core", "rtree_compat", "parser_core"]
[profile.fastopt]
inherits = "release"
incremental = true
codegen-units = 256
debug = "line-tables-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
log = "=0.4.34"

[patch.crates-io]
lopdf = { path = "vendor/lopdf" }
